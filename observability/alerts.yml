# SLO alert rules (Module 2, Clips 5-6). Real Prometheus alerting rules for the
# incident dimensions: latency, quota, cost, output quality (and availability).
# They evaluate against the live metric stream Prometheus scrapes (/live-metrics),
# and fire in the same order the incident timeline shows.
groups:
  - name: genai-slos
    rules:
      - alert: LatencyP95AboveObjective
        expr: genai_latency_p95_ms > 2500
        for: 1m
        labels:
          severity: ticket
          dimension: latency
        annotations:
          summary: "p95 latency is above the 2500ms objective"

      - alert: QuotaSaturationHigh
        expr: genai_quota_saturation_pct > 90
        for: 1m
        labels:
          severity: ticket
          dimension: quota
        annotations:
          summary: "provider quota saturation is above the 90% objective"

      - alert: CostPerRequestDrift
        expr: genai_cost_per_request_usd{model="balanced-ai"} > 0.0150
        for: 1m
        labels:
          severity: ticket
          dimension: cost
        annotations:
          summary: "cost per request is above the $0.0150 objective"

      - alert: AvailabilityBelowObjective
        expr: (sum(rate(genai_requests_total{outcome="success"}[5m])) / sum(rate(genai_requests_total[5m]))) * 100 < 99
        for: 1m
        labels:
          severity: page
          dimension: availability
        annotations:
          summary: "availability is below the 99% objective"

      - alert: QualityPassRateBelowObjective
        expr: genai_quality_pass_rate < 90
        for: 1m
        labels:
          severity: page
          dimension: output_quality
        annotations:
          summary: "output quality pass rate is below the 90% objective"
