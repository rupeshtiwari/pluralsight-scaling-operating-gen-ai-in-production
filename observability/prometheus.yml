# Prometheus (Module 2, Clips 5-6). Scrapes the FastAPI service's live metrics
# and evaluates the SLO alert rules for latency, availability, and output quality.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: genai-service
    # /live-metrics advances the incident window on every scrape, so the Grafana
    # panels render and climb. (/metrics is the terminal's deterministic one-shot
    # snapshot for Clip 5 — same metric names, held stable across scrapes.)
    metrics_path: /live-metrics
    static_configs:
      - targets: ["api:8000"]
